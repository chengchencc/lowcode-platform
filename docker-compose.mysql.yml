# 覆盖文件：用 compose 内置的 MySQL 8 代替默认的 PostgreSQL 16。
#
#   bash scripts/docker-up.sh --mysql
#
# 手工等价：
#   docker compose -f docker-compose.yml -f docker-compose.mysql.yml up -d --build
#
# 关键差别：
#   1. 内置 postgres 打上 profile，带本文件时不会被拉起；
#   2. 新增 mysql 服务，backend 改为等它健康；
#   3. DATABASE_URL 指向容器名 mysql（不是 host.docker.internal）。
#
# 数据在命名卷 flowform-mysql-data 里，容器重建不丢。

services:
  postgres:
    profiles: ["postgres"]

  mysql:
    image: mysql:8.0
    container_name: flowform-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-flowform}
      MYSQL_USER: ${MYSQL_USER:-flowform}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-flowform123}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    volumes:
      - flowform-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1",
             "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # 与 PostgreSQL 一样刻意不对外暴露 3306；需要本机连库排查时临时加 ports 即可。

  backend:
    depends_on: !override
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-flowform}:${MYSQL_PASSWORD:-flowform123}@mysql:3306/${MYSQL_DATABASE:-flowform}?charset=utf8mb4

volumes:
  flowform-mysql-data:
