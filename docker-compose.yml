# 一键部署：PostgreSQL 16 + 后端 + 前端（nginx）。
#
#   cp .env.example .env   # 至少改 JWT_SECRET 与 PG 密码
#   docker compose up -d --build
#   → http://localhost:8080
#
# 改用 MySQL 8 就叠加覆盖文件：
#   docker compose -f docker-compose.yml -f docker-compose.mysql.yml up -d --build
#
# 或者用封装脚本（会自动生成 JWT_SECRET 并等健康检查通过）：
#   bash scripts/docker-up.sh          # 默认：PostgreSQL 16
#   bash scripts/docker-up.sh --mysql  # 改用 MySQL 8
#
# 与 docker-compose.dev.yml 的分工：那个只起数据库，给本机直跑前后端用；
# 这个起完整形态，给内部试用/交付用。

services:
  postgres:
    image: postgres:16-alpine
    container_name: flowform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DATABASE:-flowform}
      POSTGRES_USER: ${PG_USER:-flowform}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-flowform123}
      TZ: Asia/Shanghai
    # 兼容老内核 / libseccomp（内网 CentOS UAT）：官方镜像默认 seccomp 下可能起不来
    security_opt:
      - seccomp:unconfined
    volumes:
      - flowform-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-flowform} -d ${PG_DATABASE:-flowform}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    # 刻意**不对外暴露 5432**：只有后端需要连它。
    # 需要本机连库排查时，临时加 ports: ["15432:5432"] 即可。

  backend:
    build:
      context: ./backend
      args:
        # 依赖安装源：默认国内镜像，可在 .env 覆盖（海外环境改成 https://pypi.org/simple）
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    container_name: flowform-backend
    restart: unless-stopped
    environment:
      # 与开发期唯一的差别就是这一行（决策 D1：切库只改连接串）
      DATABASE_URL: postgresql+psycopg://${PG_USER:-flowform}:${PG_PASSWORD:-flowform123}@postgres:5432/${PG_DATABASE:-flowform}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 里设置 JWT_SECRET}
      DEBUG: "false"
      # 浏览器与前端同源（nginx 反代 /api），因此这里不需要放行跨域来源
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123456}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      SEED_DEMO_ORG: "true"
      STORAGE_ROOT: /app/storage
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
    volumes:
      # 附件落在卷里 —— 容器重建不丢文件
      - flowform-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/readyz', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      args:
        # 同 PIP_INDEX_URL：默认 npmmirror，海外环境改成 https://registry.npmjs.org
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    container_name: flowform-frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  flowform-postgres-data:
  flowform-storage:
