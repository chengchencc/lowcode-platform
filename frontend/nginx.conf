# 前端站点配置（生产形态）。
#
# 两个要点：
#   1. 浏览器只与这一个源打交道：静态资源走 nginx，/api 反代到后端容器。
#      因此**不需要 CORS**，也不需要给前端打包时塞后端域名。
#   2. SPA 用 history 路由（/workbench/todo 这类真实路径），
#      任何未命中的路径都要回退到 index.html，否则刷新即 404。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;

    # 带 hash 的静态资源可以长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 入口页不缓存，否则发版后用户还拿着旧的 index.html
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 附件上传：后端限 20MB（MAX_UPLOAD_MB），这里留出余量给 multipart 开销
        client_max_body_size 30m;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
