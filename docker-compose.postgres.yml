# 覆盖文件：用 compose 内置的 PostgreSQL 16 代替 MySQL 8。
#
#   bash scripts/docker-up.sh --postgres
#
# 手工等价：
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d --build
#
# 关键差别：
#   1. 内置 mysql 打上 profile，带本文件时不会被拉起；
#   2. 新增 postgres 服务，backend 改为等它健康；
#   3. DATABASE_URL 指向容器名 postgres（不是 host.docker.internal）。
#
# 数据在命名卷 flowform-postgres-data 里，容器重建不丢。

services:
  mysql:
    profiles: ["mysql"]

  postgres:
    image: postgres:16-alpine
    container_name: flowform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DATABASE:-flowform}
      POSTGRES_USER: ${PG_USER:-flowform}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-flowform123}
      TZ: Asia/Shanghai
    volumes:
      - flowform-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-flowform} -d ${PG_DATABASE:-flowform}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    # 与 MySQL 一样刻意不对外暴露 5432；需要本机连库排查时临时加 ports 即可。

  backend:
    depends_on: !override
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${PG_USER:-flowform}:${PG_PASSWORD:-flowform123}@postgres:5432/${PG_DATABASE:-flowform}

volumes:
  flowform-postgres-data:
