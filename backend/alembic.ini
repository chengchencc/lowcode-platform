# NOTE: This file must stay ASCII-only.
#
# Alembic reads alembic.ini with `encoding="locale"` (not UTF-8). On Chinese
# Windows the locale codec is GBK, so a UTF-8 Chinese comment here raises
# UnicodeDecodeError before any of our code runs. Every other file in this
# repo is UTF-8 with Chinese comments -- this one is the exception.
# The rationale is repeated, in Chinese, at the top of alembic/env.py.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# The connection string is read from app.core.config in alembic/env.py and is
# deliberately left empty here: one source of truth, so editing .env can never
# leave migrations pointed at a stale database.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
