[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "B008",  # FastAPI 依赖注入惯用 def f(x=Depends(...))
    "E501",  # 行长由 formatter 处理
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error::DeprecationWarning:app.*"]
# 并行执行：全套 343 项从 4 分钟降到约 1 分钟。
# `--dist loadfile` 让同一个文件的测试落在同一个 worker —— 保住文件内的执行顺序，
# 也避免模块级计数器等共享状态跨 worker 干扰。每个 worker 有独立的临时 SQLite 库。
# 需要单进程调试时用 `pytest -n0`。
addopts = "-n auto --dist loadfile"
