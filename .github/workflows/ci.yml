name: ci

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: 安装后端依赖
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -r backend/requirements-dev.txt
      - name: 后端测试与静态检查
        run: bash scripts/check.sh backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装前端依赖
        run: npm ci
        working-directory: frontend
      - name: 类型检查、组件测试与构建
        run: bash scripts/check.sh frontend

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: 安装后端依赖
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -r backend/requirements-dev.txt
      - name: API 黑盒验收
        run: bash scripts/api.sh

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            testing/e2e/package-lock.json
      - name: 安装后端依赖
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -r backend/requirements-dev.txt
      - name: 安装前端依赖
        run: npm ci
        working-directory: frontend
      - name: 安装 E2E 依赖
        run: npm ci
        working-directory: testing/e2e
      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium
        working-directory: testing/e2e
      - name: P0 浏览器旅程
        run: E2E_BROWSER_CHANNEL=bundled bash scripts/e2e.sh @p0
      - name: 上传失败现场
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            testing/.runtime/playwright-report
            testing/.runtime/test-results
          retention-days: 7
